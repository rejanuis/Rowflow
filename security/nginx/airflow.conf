# TLS reverse proxy in front of the Airflow API server / UI (internal port 9091).
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;   # brute-force brake for /auth/*

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/airflow.crt;
    ssl_certificate_key /etc/nginx/certs/airflow.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s;                 # Docker DNS; nginx still starts if Airflow is not up yet
    set $airflow http://airflow-apiserver:9091;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";
    proxy_buffering off;                           # log streaming
    proxy_redirect off;                            # pass Airflow's Location headers through unchanged
    proxy_read_timeout 300s;

    # Task Execution API is for workers on the internal Docker network only - never expose it
    location /execution/ { return 404; }

    location /auth/ {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $airflow;
    }

    location / {
        proxy_pass $airflow;
    }
}
